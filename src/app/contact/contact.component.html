<section id="contact" class="contact py-5" style="background: linear-gradient(to right, #f8f9fa, #e9ecef)">
  <div class="container">
    <h2 class="display-4 mb-4 text-center text-dark">Contact Us</h2>
    <p class="lead text-center mb-5 text-muted">Ready to start your project? Reach out to us and let’s bring your ideas to life!</p>
    <div class="row justify-content-center">
      
      <!-- Contact Form Section -->
      <div class="col-md-6 mb-4">
        <h4 class="mb-4 text-center">Send Us a Message</h4>
        <form action="https://formspree.io/f/meoopbwa" method="POST" class="bg-light p-4 rounded shadow-sm">
          <div class="form-group mb-3">
            <input type="text" class="form-control" name="name" placeholder="Your Name" required />
          </div>
          <div class="form-group mb-3">
            <input type="email" class="form-control" name="email" placeholder="Your Email" required />
          </div>
          <div class="form-group mb-3">
            <textarea class="form-control" name="message" placeholder="Your Message" rows="4" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-block w-100">Send Message</button>
        </form>
      </div>

      <!-- Office Location Section -->
      <div class="col-md-6">
        <h4 class="mb-4 text-center">Our Office</h4>
        <div class="text-center">
          <p><i class="fas fa-map-marker-alt mr-2"></i> 123 Software Lane, Silicon Valley, CA 94043</p>
          <p><i class="fas fa-envelope mr-2"></i> Email: <a href="mailto:contactsoftwarecompany.com">contactsoftwarecompany.com</a></p>
          <p><i class="fas fa-phone-alt mr-2"></i> Phone: <a href="tel:+11234567890">+1 123 456 7890</a></p>
        </div>

        <!-- Map Section (Optional) -->
        <!-- <div class="map mt-4">
          <iframe src="https://www.google.com/maps/embed/v1/place?q=123+Software+Lane,+Silicon+Valley,+CA+94043&key=YOUR_GOOGLE_MAPS_API_KEY" width="100%" height="250" frameborder="0" style="border:0;" allowfullscreen=""></iframe>
        </div> -->
      </div>

    </div>
  </div>
</section>
