<div id="contact" class="container contact-section mt-5">
  <h2>Contact Us</h2>
  <p>
    Ready to start your project? Reach out to us and let’s bring your ideas to
    life!
  </p>
  <div class="row justify-content-center contact-form">
    <!-- Contact Form Section -->
    <div class="col-md-6 mb-4">
      <!-- <h4 class="mb-4 text-center">Send Us a Message</h4> -->
      <form
        action="https://formspree.io/f/meoopbwa"
        method="POST"
        class="p-4 rounded shadow-sm"
      >
        <div class="form-group mb-3">
          <label for="full-name">Full Name</label>
          <input
            type="text"
            class="form-control"
            name="name"
            placeholder="Your Name"
            required
          />
        </div>
        <div class="form-group mb-3">
          <label for="email">Email address</label>
          <input
            type="email"
            class="form-control"
            name="email"
            placeholder="Your Email"
            required
          />
        </div>
        <div class="form-group mb-3">
          <label for="select-where">Where did you hear from us?</label>
          <select id="select-where" name="select-where" required="">
            <option value="">Please choose one option:</option>
            <option value="friends">Friends and family</option>
            <option value="youtube">YouTube video</option>
            <option value="podcast">Podcast</option>
            <option value="ad">Facebook ad</option>
            <option value="others">Others</option>
          </select>
        </div>
        <!-- <div class="form-group mb-3">
          <textarea
            class="form-control"
            name="message"
            placeholder="Your Message"
            rows="4"
            required
          ></textarea>
        </div> -->
        <button type="submit" class="btn btn-form">Sign Up Now</button>
      </form>
    </div>
