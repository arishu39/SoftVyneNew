<section class="full-stack" *ngIf="content">
  <h1>{{ content.title }}</h1>
  <p>
    {{ content.description }}
  </p>

  <div class="grid-container">
    <div class="grid-item" *ngFor="let item of content.items">
      <div class="icon">
        <img [src]="item.icon" [alt]="item.alt" />
      </div>
      <div class="content">
        <h2>{{ item.title }}</h2>
        <p>
          {{ item.content }}
        </p>
      </div>
    </div>
  </div>
</section>
