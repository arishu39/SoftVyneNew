<!-- Hero Section (Home) -->
<section id="home" class="hero py-5" style="background: url('assets/computer2.jpg') no-repeat center center; background-size: cover; color: white; position: relative; overflow: hidden;">
  <!-- Gradient Overlay to ensure readability -->
  <div class="overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(45deg, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.7)); z-index: 1;"></div>
  
  <!-- Content inside the hero -->
  <div class="container text-center position-relative" style="z-index: 2;">
      <h1 class="display-4 font-weight-bold mb-4 animate__animated animate__fadeIn animate__delay-1s" style="text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.8);">
          Welcome to Our Software Solutions
      </h1>
      <p class="lead mb-4 animate__animated animate__fadeIn animate__delay-2s" style="text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.8);">
          Innovative solutions for your business, built with cutting-edge technology.
      </p>
      <a class="btn btn-primary btn-lg animate__animated animate__fadeIn animate__delay-3s" href="#services" role="button" style="border-radius: 50px; padding: 15px 30px; background-color: #007bff; border-color: #007bff;">
          <i class="fas fa-cogs mr-2"></i> Explore Our Services
      </a>
  </div>

  <!-- Adding an optional scroll down arrow animation for interactivity -->
  <div class="scroll-down text-center" style="position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%); z-index: 2;">
      <a href="#services" class="btn btn-light btn-sm animate__animated animate__bounce animate__infinite" role="button" style="border-radius: 50%; padding: 10px 15px; background-color: rgba(255, 255, 255, 0.7);">
          <i class="fas fa-arrow-down"></i>
      </a>
  </div>
</section>
