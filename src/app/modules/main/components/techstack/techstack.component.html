<section class="tech-section">
  <div class="container-fluid">
    <div class="section-header">
      <h2 class="section-title">Our Technology Expertise</h2>
      <p class="tech-description">
        Leveraging cutting-edge technologies to build innovative solutions that
        drive business growth
      </p>
    </div>

    <div class="tech-container" [@staggerAnimation]="tabs.length">
      <div
        class="tech-card"
        *ngFor="let tab of tabs"
        [class.active]="tab.isActive"
        (click)="selectTab(tab)"
        [@cardAnimation]
      >
        <h3 class="card-title">{{ tab.title }}</h3>
        <div class="tech-icons">
          <div
            class="tech-icon"
            *ngFor="let icon of techContent[tab.id][0].icons.slice(0, 9)"
          >
            <img
              [src]="icon.src"
              [alt]="icon.alt"
              [style.width]="icon.width"
              loading="lazy"
            />
            <span class="icon-name">{{ icon.alt }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
