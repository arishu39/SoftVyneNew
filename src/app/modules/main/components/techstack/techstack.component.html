<div class="container my-5 tech-section text-center">
  <h2 class="section-title">Our Tech Stack</h2>
  <p class="tech-description">
    Our expertise spans over 100+ innovative technologies and platforms,
    enabling us to deliver customized business solutions.
  </p>

  <!-- Navigation Tabs -->
  <ul
    class="nav nav-tabs mb-4 justify-content-center"
    id="techTabs"
    role="tablist"
  >
    <li class="nav-item" *ngFor="let tab of tabs">
      <a
        class="nav-link"
        [class.active]="tab.isActive"
        [id]="tab.id + '-tab'"
        data-bs-toggle="tab"
        [href]="'#' + tab.id"
        role="tab"
        [attr.aria-controls]="tab.id"
        [attr.aria-selected]="tab.isActive"
      >
        {{ tab.title }}
      </a>
    </li>
  </ul>

  <div class="tab-content" id="techTabsContent">
    <div
      class="tab-pane fade"
      [class.show]="tab.isActive"
      [class.active]="tab.isActive"
      *ngFor="let tab of tabs"
      [id]="tab.id"
      role="tabpanel"
      [attr.aria-labelledby]="tab.id + '-tab'"
    >
      <div
        class="container tech-category"
        *ngFor="let category of techContent[tab.id]"
      >
        <h5 class="tech-heading">{{ category.heading }}</h5>
        <div class="d-flex flex-wrap justify-content-center tech-icons">
          <img
            *ngFor="let icon of category.icons"
            [src]="icon.src"
            [alt]="icon.alt"
            [title]="icon.alt"
            [style.width]="icon.width"
            loading="lazy"
          />
        </div>
      </div>
    </div>
  </div>
</div>
