<section class="full-stack" *ngIf="content">
  <div class="container text-center">
    <h2 class="section-title">{{ content.title }}</h2>
    <p class="about-subheading">{{ content.description }}</p>
  </div>

  <div class="container">
    <div class="grid-container">
      <div class="grid-item" *ngFor="let item of content.items; let i = index">
        <div class="number">{{ i + 1 }}</div>
        <h2>{{ item.title }}</h2>
        <p>{{ item.content }}</p>
      </div>
    </div>
  </div>
</section>
