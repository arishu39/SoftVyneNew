<div class="hero" style="background-image: url('assets/front_end_1980_800_3.png');">
  <div class="hero-content">
    <h1 class="hero-title">Empower Your Business with <span class="highlight">Next-Generation AI</span></h1>
    <p class="hero-description">Leverage the power of Generative AI and Intelligent Agents to automate workflows, enhance decision-making, and deliver personalized user experiences at scale.</p>
    <button class="cta-button">Start Your Journey</button>
  </div>
</div>

<div class="banner">
  <div class="banner-icons">
    <ng-container *ngIf="techstack.getMachineLearningIcons().length; else noIcons">
      <img *ngFor="let icon of techstack.getMachineLearningIcons()" [src]="icon.src" [alt]="icon.alt" [style.width]="icon.width || 'auto'" />
    </ng-container>
    <ng-template #noIcons>
      <p>No icons available at the moment.</p>
    </ng-template>
  </div>
</div>

<div class="content" [class.loading-state]="loading">
  <app-hiring [serviceType]="serviceType"></app-hiring>
  <app-hiredev [serviceType]="serviceType"></app-hiredev>
  <app-fullstack [serviceType]="serviceType"></app-fullstack>
  <app-pricing [serviceType]="serviceType"></app-pricing>
  <app-services></app-services>

  <app-contactlocations></app-contactlocations>
  <app-contact></app-contact>
</div>

<div class="loader-container" *ngIf="loading">
  <div class="spinner"></div>
</div>
