<div id="contact" class="contact-section">
  <div class="container">
    <div class="contact-header">
      <h2>Get In Touch</h2>
      <p>
        Have a project in mind? Let's discuss how we can help bring your vision
        to reality.
      </p>
    </div>

    <div class="row g-4 justify-content-center">
      <!-- Contact Form Section -->
      <div class="col-lg-6">
        <form
          action="https://formspree.io/f/meoopbwa"
          method="POST"
          class="contact-form"
        >
          <div class="mb-4">
            <label for="full-name">
              <i class="fas fa-user me-2"></i>Full Name
            </label>
            <input
              type="text"
              class="form-control"
              name="name"
              placeholder="John Doe"
              required
            />
          </div>

          <div class="mb-4">
            <label for="email">
              <i class="fas fa-envelope me-2"></i>Email Address
            </label>
            <input
              type="email"
              class="form-control"
              name="email"
              placeholder="john@example.com"
              required
            />
          </div>

          <div class="mb-4">
            <label for="select-where">
              <i class="fas fa-globe me-2"></i>How did you find us?
            </label>
            <select
              id="select-where"
              name="select-where"
              class="form-select"
              required
            >
              <option value="">Select an option</option>
              <option value="friends">Friends and Family</option>
              <option value="youtube">YouTube</option>
              <option value="podcast">Podcast</option>
              <option value="ad">Social Media</option>
              <option value="others">Other Sources</option>
            </select>
          </div>

          <button type="submit" class="btn btn-form w-100">
            <i class="fas fa-paper-plane me-2"></i>Send Message
          </button>
        </form>
      </div>

      <!-- Contact Info Section -->
      <div class="col-lg-5 offset-lg-1">
        <div class="contact-info">
          <h4>Contact Information</h4>

          <div class="info-item">
            <i class="fas fa-map-marker-alt"></i>
            <p>123 Software Lane, Silicon Valley, CA 94043</p>
          </div>

          <div class="info-item">
            <i class="fas fa-envelope"></i>
            <p>
              <a href="mailto:contact@softwarecompany.com"
                >contactsoftwarecompany.com</a
              >
            </p>
          </div>

          <div class="info-item">
            <i class="fas fa-phone-alt"></i>
            <p><a href="tel:+11234567890">+1 123 456 7890</a></p>
          </div>

          <!-- <div class="map">
            <iframe
              src="https://www.google.com/maps/embed/v1/place?q=123+Software+Lane,+Silicon+Valley,+CA+94043&key=YOUR_GOOGLE_MAPS_API_KEY"
              width="100%"
              height="250"
              style="border: 0"
              allowfullscreen
            >
            </iframe>
          </div> -->
        </div>
      </div>
    </div>
  </div>
</div>
