<div id="contact" class="container contact-section mt-5">
  <h2 class="text-center">Contact Us</h2>
  <p class="text-center">
    Ready to start your project? Reach out to us and let’s bring your ideas to
    life!
  </p>

  <div class="row justify-content-center align-items-center">
    <!-- Contact Form Section -->
    <div class="col-md-6">
      <form
        action="https://formspree.io/f/meoopbwa"
        method="POST"
        class="p-4 rounded shadow"
      >
        <div class="mb-3">
          <label for="full-name" class="form-label">Full Name</label>
          <input
            type="text"
            class="form-control"
            name="name"
            placeholder="Your Name"
            required
          />
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input
            type="email"
            class="form-control"
            name="email"
            placeholder="Your Email"
            required
          />
        </div>

        <div class="mb-3">
          <label for="select-where" class="form-label"
            >Where did you hear about us?</label
          >
          <select
            id="select-where"
            name="select-where"
            class="form-select"
            required
          >
            <option value="">Please choose one option:</option>
            <option value="friends">Friends and family</option>
            <option value="youtube">YouTube video</option>
            <option value="podcast">Podcast</option>
            <option value="ad">Facebook ad</option>
            <option value="others">Others</option>
          </select>
        </div>

        <button type="submit" class="btn btn-form">Send Message</button>
      </form>
    </div>

    <!-- Office Location Section -->
    <div class="col-md-6 text-center">
      <h4>Our Office</h4>
      <p>
        <i class="fas fa-map-marker-alt"></i> 123 Software Lane, Silicon Valley,
        CA 94043
      </p>
      <p>
        <i class="fas fa-envelope"></i> Email:
        <a href="mailto:contactsoftwarecompany.com"
          >contactsoftwarecompany.com</a
        >
      </p>
      <p>
        <i class="fas fa-phone-alt"></i> Phone:
        <a href="tel:+11234567890">+1 123 456 7890</a>
      </p>

      <!-- Optional Google Map -->
      <div class="map mt-4">
        <iframe
          src="https://www.google.com/maps/embed/v1/place?q=123+Software+Lane,+Silicon+Valley,+CA+94043&key=YOUR_GOOGLE_MAPS_API_KEY"
          width="100%"
          height="250"
          style="border: 0"
          allowfullscreen=""
        >
        </iframe>
      </div>
    </div>
  </div>
</div>
