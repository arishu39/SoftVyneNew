<nav class="navbar navbar-expand-lg navbar-light">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">
      <!-- <img src="assets/Fynore_logo.png" alt="Logo" /> -->
      <img src="assets/Fynore_logo_4.png" alt="Logo" />
    </a>

    <!-- Toggler for Mobile -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="#">About Us</a>
        </li>

        <!-- Services Dropdown -->
        <li
          class="nav-item dropdown"
          (mouseenter)="toggleMainDropdown(true)"
          (mouseleave)="toggleMainDropdown(false)"
        >
          <a class="nav-link dropdown-toggle" href="#" id="servicesDropdown">
            Services
          </a>
          <ul class="dropdown-menu" [class.show]="isMainDropdownOpen">
            <li
              *ngFor="let service of services"
              class="dropdown"
              (mouseenter)="setActiveSubmenu(service.route, $event)"
              [class.active]="activeSubmenu === service.route"
            >
              <a class="dropdown-item dropdown-toggle">
                {{ service.name }}
              </a>
              <ul
                class="dropdown-menu dropdown-submenu"
                [class.show]="activeSubmenu === service.route"
              >
                <li *ngFor="let subitem of service.submenu">
                  <a
                    class="dropdown-item"
                    [routerLink]="['/services', subitem.route]"
                  >
                    {{ subitem.name }}
                  </a>
                </li>
              </ul>
            </li>
          </ul>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#">Contact Us</a>
        </li>
      </ul>

      <!-- CTA Button -->
      <button class="btn btn-primary ms-3">Book A 30 Min Call</button>
    </div>
  </div>
</nav>
